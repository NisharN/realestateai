greeting:
  - "أهلاً{name_suffix}، أنا مساعد العقارات في {brokerage}. هل تبحث عن شراء أو استئجار أو استثمار في دبي؟"
opt_out:
  - "تمام، لن أراسلك مرة أخرى. إذا غيّرت رأيك، فقط أرسل مرحباً. مع السلامة."
handoff_now:
  - "بكل تأكيد. سأحوّلك إلى {broker_name} من فريقنا وسيتواصل معك قريباً على هذا الرقم."
  - "بالتأكيد، سيتواصل معك أحد المختصين من فريقنا قريباً. شكراً لصبرك."
clarify_budget:
  - "{budget_question}"
  - "للتأكد من الميزانية، هل المبلغ بالدرهم الإماراتي؟ وهل هو سعر الشراء الإجمالي أم الإيجار السنوي؟"
clarify_area:
  - "أريد أن أبحث في المكان الصحيح — أي منطقة تقصد؟ مثلاً مرسى دبي، وسط المدينة، JVC أو دبي هيلز."
answer_area:
  - "{area_name} {area_summary} تبعد {area_travel_text}، ومتوسط الأسعار حوالي {area_price_psf} درهم للقدم المربع. هل أعرض لك خيارات هناك؟"
  - "{area_name} {area_summary} متوسط الأسعار حوالي {area_price_psf} درهم للقدم المربع. هل أعرض لك خيارات هناك؟"
  - "{area_name} {area_summary} تبعد {area_travel_text}. هل أعرض لك خيارات هناك؟"
  - "{area_name} خيار شائع. هل تريد أن أعرض لك بعض العقارات هناك لتعرف ما تحصل عليه بميزانيتك؟"
answer_area_ranking:
  - "بحسب عروضنا الحالية، أعلى عوائد الإيجار الإجمالية في {ranking_text}. ولتضييق الخيارات، {next_question}"
  - "من المعروض الحالي، أفضل العوائد الآن في {ranking_text}. {next_question}"
answer_area_ranking_empty:
  - "العوائد تختلف كثيراً بين المناطق ومستويات الأسعار، وأفضّل أن أعرض لك أرقاماً حقيقية من العروض بدلاً من التخمين. {next_question}"
  - "سؤال جيد — أذكر العوائد فقط من العروض الحالية، وأحتاج القليل من التفاصيل. {next_question}"
answer_property:
  - "{property_title} في {property_area}: {property_type} بـ {property_bedrooms} غرف، {property_size} قدم مربع، بسعر {property_price} درهم. هل تريد معاينته؟"
  - "بكل سرور — أي عقار من التي عرضتها تريد معرفة المزيد عنه؟"
compare:
  - "هذه مقارنة بين {compare_titles}. الفرق الأساسي في السعر والمساحة كما في الجدول. أيّها أقرب لما تريد؟"
  - "أستطيع مقارنة عقارين أو ثلاثة من الخيارات التي عرضتها. أيّها تريد مقارنتها؟"
handle_objection:
  - "كلامك منطقي. عدّلت البحث وهذه {result_count} خيارات تناسب أكثر من ناحية {objection_topic}. هل يناسبك أحدها؟"
  - "مفهوم. أخبرني ما الأهم لك — السعر أم الموقع أم المساحة — وسأعدّل القائمة."
ask_next_field:
  purpose: "هل تبحث عن شراء أم استئجار أم استثمار؟"
  budget: "ما الميزانية التي تفكر فيها؟ مثلاً 1.5 مليون درهم للشراء أو 120 ألف درهم سنوياً للإيجار."
  area: "أي مناطق في دبي تفكر فيها؟ مثلاً مرسى دبي، وسط المدينة، JVC أو دبي هيلز."
  property_type: "هل تفضّل شقة أم فيلا أم تاون هاوس؟"
  bedrooms: "كم غرفة نوم تحتاج؟"
  timeline: "متى تخطط للانتقال أو إتمام الشراء — خلال 3 أشهر، 3 إلى 6 أشهر، أم لاحقاً؟"
  payment: "هل الشراء نقداً أم بتمويل عقاري؟ وإذا تمويل، هل هو معتمد مسبقاً؟"
suggest:
  - "بناءً على ما أخبرتني به، هذه {result_count} خيارات في {area_name} ضمن ميزانيتك. هل يلفت نظرك أحدها؟"
  - "هذه {result_count} عقارات تطابق طلبك. أخبرني ما يعجبك أو ما تريد تغييره."
suggest_empty:
  - "لا يوجد لدي حالياً عقار متاح يطابق كل هذه المتطلبات. هل تفكر في منطقة مجاورة أو ميزانية أعلى قليلاً؟ أو يمكن لمختص أن يبحث لك عن خيارات خارج السوق."
confirm_handoff:
  - "اختيار ممتاز. هل أطلب من مختص أن يتصل بك لترتيب المعاينة؟ {slot_suggestion}"
confirm_handoff_no_inventory:
  - "لا يوجد عرض متاح يطابق طلبك حالياً، لكن يمكن لمختص البحث عن خيارات خارج السوق أو قادمة. هل أطلب منه الاتصال بك؟ {slot_suggestion}"
handoff:
  - "تمام — سيتصل بك {broker_name} {slot_text}. ستصلك رسالة تأكيد على واتساب قريباً. شكراً لك!"
  - "تمام — سيتواصل معك مختص قريباً لترتيب المعاينة. شكراً لك!"
nurture:
  - "لا مشكلة أبداً. سأتواصل معك قرب موعدك بخيارات جديدة تناسب طلبك. راسلني في أي وقت."
small_talk_redirect:
  - "بكل سرور. لأجد لك العقار المناسب، {next_question_lower}"
  - "أكيد. لنصل إلى الخيارات المناسبة — {next_question_lower}"
small_talk_generic:
  - "يسعدني مساعدتك. أخبرني أكثر عما تبحث عنه — المنطقة أو الميزانية أو نوع العقار — وسأعرض لك الخيارات المناسبة."
goodbye:
  - "شكراً لتواصلك{name_suffix}. حفظت تفاصيل طلبك، وعندما تكون مستعداً راسلني هنا وسنكمل من حيث توقفنا."
why_explain:
  purpose: "الشراء والإيجار والاستثمار لها خيارات وإجراءات مختلفة، لذلك يساعدني هذا على عرض الخيارات الصحيحة."
  budget: "الميزانية تساعدني على عرض العقارات المناسبة لك فقط بدلاً من إضاعة وقتك."
  area: "معرفة المناطق التي تفضلها تساعدني على اختيار المجتمعات المناسبة."
  property_type: "الشقق والفلل والتاون هاوس أسواق مختلفة تماماً في دبي، لذلك يضيّق هذا البحث كثيراً."
  bedrooms: "عدد الغرف هو أسرع طريقة لتصفية العقارات غير المناسبة."
  timeline: "الجدول الزمني يحدد إن كنت سأعرض عقارات جاهزة أو قيد الإنشاء."
  payment: "الشراء نقداً أو بالتمويل له خطوات مختلفة، لذلك يساعدني هذا على إرشادك بشكل صحيح."
ask_reaction:
  - "تم، شكراً لك. هل يعجبك أي من الخيارات التي عرضتها، أم أعدّل البحث؟"
after_handoff:
  - "شكراً — {broker_name} لديه تفاصيلك وسيتواصل معك قريباً. إذا تغيّر شيء، أخبرني."
confirm_transcript:
  - "هل قلت: {transcript}؟ قل نعم أو أعد القول."
stt_failed:
  - "عذراً، لم أسمع ذلك بوضوح. هل يمكنك الإعادة أو كتابة رسالتك؟"
error_fallback:
  - "عذراً، لم أفهم ذلك تماماً. هل يمكنك إعادة الصياغة؟"
followup_1:
  - "مرحباً {name}، أنا علي من فريق العقارات. وصلتنا عروض جديدة تناسب طلبك — هل أرسلها لك؟"
followup_2:
  - "مرحباً {name}، أتابع معك — هل تغيّر شيء في ما تبحث عنه؟ يمكنني تحديث قائمتك في أي وقت."
followup_3:
  - "مرحباً {name}، هذه آخر متابعة مني. عندما تكون مستعداً للبحث مجدداً، راسلني هنا وسأكمل من حيث توقفنا."
