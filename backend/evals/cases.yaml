# Offline eval harness for the conversation engine (architecture §10). Each case
# is one buyer conversation run through handle_turn() against the in-memory
# store (no LLM keys → template path, so results are deterministic). A case
# passes when every turn's expectations hold. Run: python -m scripts.run_evals
- id: greeting_to_qualification_en
  turns:
    - say: "hi"
      move: greeting
    - say: "I want to buy a 2 bed apartment in Dubai Marina"
      move: ask_next_field
      slots: {purpose: buy, area: ["Dubai Marina"]}
    - say: "around 2.5 million"
      move: suggest
      cards_min: 1
      slots: {"budget.max_aed": 2500000}
- id: rent_budget_per_year_en
  turns:
    - say: "looking to rent an apartment in JVC, 1 bedroom"
      move: ask_next_field
      slots: {purpose: rent}
    - say: "120k per year"
      move: suggest
- id: ambiguous_budget_clarify
  turns:
    - say: "buy a villa in arabian ranches"
    - say: "budget 3"
      move: clarify_budget
- id: unknown_area_clarify
  turns:
    - say: "I want to buy in Atlantis Moonbase"
      move: clarify_area
- id: stop_wins
  turns:
    - say: "2 bed in marina to buy"
    - say: "STOP"
      move: opt_out
      ended: true
- id: human_request_hands_off
  turns:
    - say: "I want to talk to a real person now"
      move: handoff_now
      handoff: true
- id: explicit_handoff_confirmation
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "within 3 months, cash"
      move: confirm_handoff
    - say: "yes please"
      move: handoff
      handoff: true
- id: no_handoff_without_yes
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
    - say: "within 3 months, cash"
      move: confirm_handoff
    - say: "not yet, just browsing"
      handoff: false
- id: area_question_uses_stored_travel_only
  turns:
    - say: "how far is dubai marina from downtown?"
      move: answer_area
      reply_contains: ["approx"]
- id: arabic_flow
  turns:
    - say: "مرحبا، أبحث عن شقة غرفتين في مرسى دبي للشراء"
      language: ar
      move: ask_next_field
    - say: "الميزانية 2.5 مليون"
      language: ar
      move: suggest
- id: offtopic_redirects_to_discovery
  turns:
    - say: "hello"
      move: greeting
    - say: "what's the weather like today?"
      move: ask_next_field
- id: after_handoff_stays_quiet
  turns:
    - say: "talk to an agent please"
      move: handoff_now
    - say: "any villas in jumeirah?"
      move: after_handoff
# ---------------------------------------------------------------- objections
- id: objection_price_after_shortlist
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "that's too expensive for me"
      move: handle_objection
- id: objection_location_after_shortlist
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "too far from my office, different area please"
      move: handle_objection
- id: objection_size_after_shortlist
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
      cards_min: 1
    - say: "these are too small, I need more space"
      move: handle_objection
- id: objection_payment_plan
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "do any of these have a payment plan?"
      move: handle_objection
- id: objection_handover
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "when is the handover? I need ready to move"
      move: answer_property
- id: objection_before_shortlist_is_not_objection
  turns:
    - say: "everything in dubai is too expensive, but I want to buy a 1 bed"
      move: ask_next_field
      slots: {purpose: buy}
# ------------------------------------------------------------- rude / abuse
- id: rude_message_gets_calm_redirect
  turns:
    - say: "hello"
      move: greeting
    - say: "you are a useless stupid bot"
      move: ask_next_field
      reply_excludes: ["stupid", "useless"]
- id: rude_then_recovers
  turns:
    - say: "this is rubbish"
    - say: "fine. buy a villa in arabian ranches, 5 million"
      move: suggest
      slots: {purpose: buy, "budget.max_aed": 5000000}
- id: two_misunderstandings_hand_off
  turns:
    - say: "hello"
      move: greeting
    - say: "asdkjh qwe zxc"
    - say: "blorp flim flam"
      move: handoff_now
      handoff: true
    - say: "gnarf"
      move: after_handoff
# ------------------------------------------------------------ not interested
- id: not_interested_nurtures
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "actually I'm not interested anymore"
      move: nurture
      handoff: false
- id: already_bought_nurtures
  turns:
    - say: "I already bought somewhere else, thanks"
      move: nurture
- id: long_timeline_nurtures
  turns:
    - say: "buy 2 bed apartment dubai marina, budget 2.5m, maybe next year or later"
      move: nurture
# -------------------------------------------------------------- area questions
- id: area_schools_question
  turns:
    - say: "are there schools in dubai hills?"
      move: answer_area
- id: area_metro_question
  turns:
    - say: "is there a metro near JVC?"
      move: answer_area
- id: area_travel_downtown_to_marina
  turns:
    - say: "how far is downtown from dubai marina?"
      move: answer_area
      reply_excludes: ["exactly"]
- id: area_question_unknown_origin_answers_known_side
  turns:
    - say: "how far is Narnia from downtown?"
      move: answer_area
      reply_excludes: ["Narnia"]
- id: area_question_arabic
  turns:
    - say: "كم تبعد مرسى دبي عن داون تاون؟"
      language: ar
      move: answer_area
# --------------------------------------------------------------- arabic / mixed
- id: arabic_stop_wins
  turns:
    - say: "أبحث عن فيلا في المرابع العربية"
      language: ar
    - say: "توقف"
      move: opt_out
      ended: true
- id: arabic_human_request
  turns:
    - say: "أريد التحدث مع موظف"
      language: ar
      move: handoff_now
      handoff: true
- id: arabic_rent_flow
  turns:
    - say: "أريد استئجار شقة غرفة واحدة في قرية جميرا الدائرية"
      language: ar
      move: ask_next_field
      slots: {purpose: rent}
    - say: "120 ألف سنوياً"
      language: ar
      move: suggest
- id: arabic_greeting_then_english
  turns:
    - say: "مرحبا"
      language: ar
      move: greeting
    - say: "I want to buy a 2 bed apartment in dubai marina, 2.5m"
      language: en
      move: suggest
- id: mixed_arabizi_budget
  turns:
    - say: "ana abhath an shaqa 2 bed apartment in marina to buy"
      move: ask_next_field
      slots: {purpose: buy}
    - say: "2.5 مليون"
      move: suggest
      slots: {"budget.max_aed": 2500000}
- id: mixed_english_with_arabic_area
  turns:
    - say: "buy 3 bed villa في دبي هيلز, 6 million"
      move: suggest
      slots: {purpose: buy}
# --------------------------------------------------------------- budgets
- id: budget_lakh_style_clarifies
  turns:
    - say: "buy apartment marina"
    - say: "1.5"
      move: clarify_budget
- id: budget_range_uses_max
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "between 2 and 2.5 million"
      move: suggest
      slots: {"budget.max_aed": 2500000}
- id: budget_monthly_rent_normalised
  turns:
    - say: "rent 1 bed apartment jvc"
    - say: "10k per month"
      move: suggest
      slots: {"budget.max_aed": 120000}
- id: budget_words_million
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "two point five million dirhams"
      move: suggest
# --------------------------------------------------------------- handoff paths
- id: viewing_request_confirms_first
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "can I book a viewing for the first one?"
      move: confirm_handoff
      handoff: false
    - say: "yes"
      move: handoff
      handoff: true
- id: liked_property_offers_specialist
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "I love the first one"
      move: confirm_handoff
- id: declined_handoff_refines
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
    - say: "I like the first one"
      move: confirm_handoff
    - say: "no, show me other options"
      move: suggest
      handoff: false
- id: call_me_is_human_request
  turns:
    - say: "just call me"
      move: handoff_now
      handoff: true
- id: are_you_a_bot_is_not_handoff
  turns:
    - say: "are you a bot?"
      handoff: false
- id: no_guarantees_in_reply
  turns:
    - say: "buy 2 bed apartment dubai marina"
    - say: "budget 2.5m"
      move: suggest
      reply_excludes: ["guaranteed", "best price", "risk-free"]
- id: no_invented_prices_when_no_inventory
  turns:
    - say: "buy a 6 bed villa in international city"
    - say: "budget 300k"
      move: suggest
      reply_contains: ["don't have a live listing"]
      reply_excludes: ["AED 3", "million"]
# --------------------------------------------------- area resolution edge cases
- id: palm_jumeirah_is_not_also_jumeirah
  turns:
    - say: "buy a villa in Palm Jumeirah"
      slots: {area: ["Palm Jumeirah"]}
- id: jbr_full_name_single_area
  turns:
    - say: "rent in Jumeirah Beach Residence"
      slots: {area: ["Jumeirah Beach Residence"], purpose: rent}
- id: damac_hills_is_not_dubai_hills
  turns:
    - say: "townhouse in damac hills to buy"
      slots: {area: ["DAMAC Hills"]}
- id: two_distinct_areas_both_kept
  turns:
    - say: "buy a 2 bed in marina or jlt"
      slots: {area: ["Dubai Marina", "Jumeirah Lakes Towers"]}
- id: area_typo_fuzzy_resolves
  turns:
    - say: "buy apartment in dubai marnia"
      slots: {area: ["Dubai Marina"]}
- id: jumeirah_alone_resolves_to_jumeirah
  turns:
    - say: "villa in jumeirah to buy"
      slots: {area: ["Jumeirah"]}
# ----------------------------------------------- numbers that are not budgets
- id: arabic_room_count_is_not_budget
  turns:
    - say: "أريد شراء شقة 3 غرف في الخليج التجاري"
      language: ar
      move: ask_next_field
      slots: {bedrooms: 3, purpose: buy}
- id: english_room_count_is_not_budget
  turns:
    - say: "buy 3 bed apartment in business bay"
      move: ask_next_field
- id: sqft_is_not_budget
  turns:
    - say: "buy a 1500 sqft apartment in downtown"
      move: ask_next_field
      slots: {purpose: buy, area: ["Downtown Dubai"]}
- id: floor_is_not_budget
  turns:
    - say: "buy apartment on floor 20 in marina"
      move: ask_next_field
- id: bare_number_after_type_clarifies
  turns:
    - say: "buy apartment in marina"
    - say: "2"
      move: clarify_budget
- id: budget_usd_kept_as_usd
  turns:
    - say: "buy apartment in marina"
    - say: "usd 800k"
      move: suggest
# -------------------------------------------------------- handoff wording
- id: no_inventory_handoff_does_not_say_great_choice
  turns:
    - say: "buy 1 bed apartment in business bay"
    - say: "1.2 million"
      move: suggest
      cards_max: 0
    - say: "3 months, cash"
      move: suggest
      cards_max: 0
    - say: "ok"
      move: confirm_handoff
      reply_excludes: ["great choice"]
    - say: "yes please"
      move: handoff
      handoff: true
- id: arabic_no_inventory_handoff_wording
  turns:
    - say: "أريد شراء شقة غرفة واحدة في الخليج التجاري"
      language: ar
    - say: "1.2 مليون"
      move: suggest
      cards_max: 0
    - say: "خلال 3 أشهر، كاش"
      move: suggest
      cards_max: 0
    - say: "تمام"
      move: confirm_handoff
      reply_excludes: ["اختيار ممتاز"]

- id: shortlist_then_empty_search_uses_no_inventory_wording
  turns:
    - say: "buy a 2 bed apartment in dubai marina"
    - say: "2.5 million"
      move: suggest
      cards_min: 1
    - say: "actually I want a villa in business bay for 1.2 million"
      move: suggest
      cards_max: 0
    - say: "3 months, cash"
      move: suggest
      cards_max: 0
    - say: "ok"
      move: confirm_handoff
      reply_excludes: ["great choice"]
      reply_includes: ["specialist"]

# --- English robustness (from adversarial probe) -----------------------------
- id: en_sidestepped_type_does_not_dangle
  turns:
    - say: "i wanna rent a place"
      slots: {purpose: rent}
    - say: "marina or jbr"
    - say: "like 120k a year"
    - say: "1 bed is fine"
      slots: {bedrooms: 1}
      move: suggest
      reply_excludes: ["options —"]
- id: en_invest_not_rent
  turns:
    - say: "I want to invest, what areas give good rental yield?"
      slots: {purpose: invest}
- id: en_bedroom_range_not_budget
  turns:
    - say: "buy"
    - say: "marina"
    - say: "2-3 bedrooms"
      move: ask_next_field
      slots: {bedrooms: 2}
      reply_excludes: ["2 million or 2 thousand"]
    - say: "between 2 and 3 million"
      move: suggest
      slots: {budget.min_aed: 2000000.0, budget.max_aed: 3000000.0}
    - say: "3-6 months"
      slots: {timeline: 6_months}
      reply_excludes: ["3 million or 3 thousand"]
- id: en_why_question_is_explained
  turns:
    - say: "rent"
    - say: "why do you need my budget?"
      move: ask_next_field
      reply_contains: ["budget lets me", "What budget"]
- id: en_goodbye_closes_politely
  turns:
    - say: "buy"
    - say: "downtown 2br 3m 3 months"
    - say: "thanks, that's all for now"
      move: goodbye
      ended: false
      reply_contains: ["saved your brief"]
- id: en_million_typo
  turns:
    - say: "buy a 2 bed apartment in dubai marina"
    - say: "2.5 milion"
      move: suggest
      slots: {budget.max_aed: 2500000.0}
- id: en_price_question_about_area
  turns:
    - say: "What's the price of apartments in Downtown?"
      move: answer_area
      reply_contains: ["Downtown"]
- id: en_flexible_and_this_year_timelines
  turns:
    - say: "buy a 1 bed in JVC for 900k"
      move: suggest
    - say: "flexible"
      slots: {timeline: 12_months}
- id: en_one_br_implies_apartment
  turns:
    - say: "I'm relocating to Dubai in 2 months for work and need a furnished 1BR to rent in Business Bay, max 90,000 per year"
      slots: {property_type: apartment, bedrooms: 1, purpose: rent, timeline: 3_months}
      move: suggest
