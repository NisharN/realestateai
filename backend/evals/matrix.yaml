matrix:
  # --------------------------------------------------------------- English
  - id: en_one_shot
    turns:
      - say: "I want to {purpose} a {beds} bed {type} in {area}"
        move: ask_next_field
        language: en
        slots: {purpose: "{purpose}", area: ["{area}"]}
      - say: "around {budget}"
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
  - id: en_alias_area
    turns:
      - say: "looking to {purpose} a {type} in {area_alias}, {beds} bedrooms"
        move: ask_next_field
        slots: {purpose: "{purpose}", area: ["{area}"]}
      - say: "budget {budget}"
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
  - id: en_budget_first_clarifies_period
    # A bare amount with no purpose yet: never assume sale vs yearly rent.
    turns:
      - say: "my budget is {budget}"
        move: clarify_budget
        reply_contains: ["per year"]
      - say: "to {purpose}, a {beds} bed {type} in {area}"
        move_in: [suggest, suggest_empty]
        slots: {purpose: "{purpose}", area: ["{area}"], "budget.max_aed": "{budget_aed}"}
  - id: en_greeting_then_qualify
    turns:
      - say: "hello"
        move: greeting
      - say: "{purpose} {type} {area} {beds}br"
        move: ask_next_field
        slots: {area: ["{area}"]}
      - say: "{budget}"
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
  - id: en_stop_after_qualify
    turns:
      - say: "{purpose} a {beds} bed {type} in {area}, {budget}"
      - say: "stop"
        move: opt_out
        ended: true
  - id: en_human_after_qualify
    turns:
      - say: "{purpose} a {beds} bed {type} in {area}, {budget}"
      - say: "can I speak to a human agent please"
        move: handoff_now
        handoff: true
      - say: "hello?"
        move: after_handoff
  - id: en_full_handoff
    requires: {inventory: true}
    turns:
      - say: "{purpose} {beds} bed {type} {area}"
      - say: "budget {budget}"
        move_in: [suggest, suggest_empty]
      - say: "within 3 months, cash"
        move: confirm_handoff
      - say: "yes"
        move: handoff
        handoff: true
  - id: en_no_inventory_twice_offers_specialist
    requires: {inventory: false}
    turns:
      - say: "{purpose} {beds} bed {type} {area}"
      - say: "budget {budget}"
        move: suggest
        cards_max: 0
      - say: "within 3 months, cash"
        move: suggest
        cards_max: 0
      - say: "anything else?"
        move: confirm_handoff
        reply_excludes: ["great choice"]
        reply_contains: ["off-market"]
  - id: en_no_guarantee_words
    turns:
      - say: "{purpose} a {beds} bed {type} in {area} for {budget}"
        reply_excludes: ["guaranteed", "guarantee", "risk-free"]
  # ---------------------------------------------------------------- Arabic
  - id: ar_one_shot
    turns:
      - say: "أريد شراء {type_ar} {beds} غرف في {area_ar}"
        language: ar
        move: ask_next_field
        slots: {purpose: buy, area: ["{area}"]}
      - say: "الميزانية {budget_ar}"
        language: ar
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
  - id: ar_stop
    turns:
      - say: "أبحث عن {type_ar} في {area_ar} للشراء"
        language: ar
      - say: "توقف"
        move: opt_out
        ended: true
  - id: ar_human
    turns:
      - say: "أبحث عن {type_ar} في {area_ar} للشراء"
        language: ar
      - say: "أريد التحدث مع موظف"
        move: handoff_now
        handoff: true
  # ----------------------------------------------------------------- Mixed
  - id: mixed_arabic_area_english_rest
    turns:
      - say: "{purpose} {beds} bed {type} in {area_ar}"
        move: ask_next_field
        slots: {purpose: "{purpose}", area: ["{area}"]}
      - say: "{budget_ar}"
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
  - id: mixed_arabic_purpose_english_area
    turns:
      - say: "أريد شراء {type} in {area_alias}"
        move: ask_next_field
        slots: {purpose: buy, area: ["{area}"]}
      - say: "budget {budget}"
        move_in: [suggest, suggest_empty]
        slots: {"budget.max_aed": "{budget_aed}"}
