# Parameterised eval cases (expanded by scripts/run_evals.py). Each matrix
# entry is a phrasing template × a list of scenarios; every scenario becomes one
# case with id "<matrix id>__<scenario id>". Templates use {area}, {type},
# {beds}, {budget}. Expectations use the same keys as cases.yaml; `move_in`
# accepts any listed move (a suggest turn may legitimately return suggest_empty
# when the seed inventory has no match for that community/type). A template's
# `requires` maps scenario keys to required values (e.g. inventory: true).
