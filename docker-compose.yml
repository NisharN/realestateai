# Single-tenant deployment: one stack per brokerage (see PILOT.md).
# WORKSPACE_ID identifies which brokerage this instance serves.
#
# Data modes default to "mock" so the stack is fully demoable with no API keys
# and no pending approvals. Flip an individual source to live once its
# credentials exist (WhatsApp needs Meta Business Verification, ~2-4 weeks).

x-backend-env: &backend-env
  APP_ENV: production
  APP_PORT: 8000
  WORKSPACE_ID: ${WORKSPACE_ID:-00000000-0000-0000-0000-000000000001}
  WORKSPACE_NAME: ${WORKSPACE_NAME:-Demo Brokerage}
  DATA_MODE_PROPERTIES: ${DATA_MODE_PROPERTIES:-mock}
  DATA_MODE_WHATSAPP: ${DATA_MODE_WHATSAPP:-mock}
  DATA_MODE_DLD: ${DATA_MODE_DLD:-mock}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  RAPIDAPI_UAE_REAL_ESTATE_KEY: ${RAPIDAPI_UAE_REAL_ESTATE_KEY:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  REDIS_URL: redis://redis:6379/0
  OSRM_URL: ${OSRM_URL:-http://osrm:5000}
  PIPER_MODEL_PATH: /app/models/piper
  RETENTION_RAW_DAYS: ${RETENTION_RAW_DAYS:-90}
  RETENTION_LEAD_DAYS: ${RETENTION_LEAD_DAYS:-730}
  # Fault injection (docs/runbooks/deploy.md §Fault drills). Never set in production.
  FAULT_LLM_ALL: ${FAULT_LLM_ALL:-false}
  FAULT_STT: ${FAULT_STT:-false}
  FAULT_TTS: ${FAULT_TTS:-false}
  FAULT_DB_SLOW_MS: ${FAULT_DB_SLOW_MS:-0}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/app/models
    depends_on:
      - redis
    restart: unless-stopped

  # Executes scheduled ingestion and the reminders engine. Without this
  # service, creating a schedule succeeds but nothing ever runs it — which is
  # exactly the bug that was reported.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # The clock. Enqueues due ingestion schedules every 60s and runs the
  # workflow templates every 5 minutes.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Local Postgres with the Supabase migrations applied on first start. The API
  # talks to Postgres through Supabase's PostgREST/Auth, so this service is for
  # running migrations and the RLS test matrix locally (docs/runbooks/deploy.md),
  # or as the database behind a self-hosted Supabase stack.
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realestateai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/supabase/local/00_auth_shim.sql:/docker-entrypoint-initdb.d/00_auth_shim.sql:ro
      - ./backend/supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./backend/supabase/local/01_apply_migrations.sh:/docker-entrypoint-initdb.d/01_apply_migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Self-hosted routing for the weekly travel-time precompute
  # (docs/runbooks/osrm.md). Requires ./osrm-data/uae.osrm built once.
  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 200 /data/uae.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres-data:
